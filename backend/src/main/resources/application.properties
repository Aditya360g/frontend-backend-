# =====================================================
# APPLICATION
# =====================================================

spring.application.name=selfb-backend

server.port=${SERVER_PORT:8080}


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3305/selfb_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# DATABASE CONNECTION POOL
# =====================================================

spring.datasource.hikari.pool-name=SelfBHikariPool

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false


# =====================================================
# FLYWAY MIGRATIONS
# =====================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.validate-on-migrate=true


# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when-authorized


# =====================================================
# ERROR RESPONSE SECURITY
# =====================================================

server.error.include-message=never

server.error.include-binding-errors=never

server.error.include-stacktrace=never

server.error.include-exception=false


# =====================================================
# JWT
# =====================================================

app.jwt.issuer=${JWT_ISSUER:selfb-backend}

app.jwt.secret=${JWT_SECRET}

app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}


# =====================================================
# CORS
# =====================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =====================================================
# REFRESH TOKEN
# =====================================================

app.security.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:30d}

app.security.refresh-token.cookie-name=selfb_refresh_token

app.security.refresh-token.cookie-path=/

app.security.refresh-token.same-site=${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

app.security.refresh-token.secure-cookie=${REFRESH_TOKEN_COOKIE_SECURE:false}


# =====================================================
# PASSWORD RESET
# =====================================================

app.security.password-reset.expiration=${PASSWORD_RESET_EXPIRATION:15m}

app.security.password-reset.reset-url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
app.email-verification.expiration=24h
app.email-verification.frontend-verification-url=http://localhost:5173/verify-email